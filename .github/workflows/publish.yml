name: Publish plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      npm_config_registry: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          registry-url: https://registry.npmjs.org/
      - name: Use the reviewed npm version
        run: npm install --global --ignore-scripts npm@11.13.0
      - name: Verify release tag and manifest
        run: node scripts/verify-version-sync.mjs --tag "$GITHUB_REF_NAME"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify required files, versions and KB
        run: npm run verify
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Verify registry signatures
        run: npm run audit:signatures
      - name: Audit source and permissions
        run: npm run audit && npm run audit:permissions
      - name: Check package contents
        run: npm run package:check
      - name: Smoke test built entry
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => {
            if (m.name !== 'dsh-ichuny-codex' || typeof m.apply !== 'function')
              throw new Error('unexpected plugin exports');
          })"
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
